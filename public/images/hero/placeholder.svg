<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="presentation" focusable="false">
  <!--
    Local placeholder standing in for real hero photography (CLAUDE.md §23 —
    no external hotlinked images). Uses the exact same token values as
    public/images/gallery/placeholder.svg for visual consistency across the
    site, at a wider aspect ratio suited to a hero banner. Purely
    atmospheric/decorative — the Hero component marks it alt="" and
    aria-hidden, since it conveys no information beyond the adjacent
    headline and subtitle text. Replace with real photography per
    /docs/MOCK_DATA.md §5 when available; nothing else should need to change.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1EDE1"/>
      <stop offset="100%" stop-color="#E8E2D2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1220" cy="260" r="110" fill="#C98B4A" opacity="0.85"/>
  <path d="M0 620 C 260 500, 520 500, 800 590 C 1080 680, 1340 560, 1600 610 L 1600 1000 L 0 1000 Z" fill="#3F4B3A"/>
  <path d="M0 720 C 320 620, 640 660, 960 720 C 1220 770, 1420 720, 1600 700 L 1600 1000 L 0 1000 Z" fill="#2C352A"/>
  <path d="M0 850 C 400 800, 800 820, 1200 850 C 1350 862, 1480 850, 1600 840 L 1600 1000 L 0 1000 Z" fill="#7A4B32" opacity="0.5"/>
</svg>
